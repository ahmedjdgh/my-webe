<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- خاصية ملائمة الشاشات ومنع التكبير والتصغير -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مفاجأة خاصة لرهوفة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fdf2f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* لمنع ظهور شريط التمرير العشوائي */
        }
        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        input {
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ec4899;
            border-radius: 10px;
            width: 100%;
            max-width: 200px;
            text-align: center;
            outline: none;
        }
        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 18px;
            background: #ec4899;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            max-width: 200px;
        }
        button:active {
            background: #db2777;
        }
        #gift-page {
            display: none;
        }
        .gift-box {
            font-size: 80px;
            cursor: pointer;
            margin: 20px 0;
            transition: transform 0.3s;
        }
        .gift-box:hover {
            transform: scale(1.1);
        }
        #love-message {
            display: none;
            font-size: 20px;
            color: #831843;
            font-weight: bold;
            line-height: 1.6;
            margin-top: 15px;
        }
        
        /* تذييل الصفحة */
        footer {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        footer a {
            color: #ec4899;
            text-decoration: none;
            font-weight: bold;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- صفحة الدخول -->
    <div id="login-page" class="container">
        <h2 style="font-size: 20px; color: #831843; margin-bottom: 20px;">أدخلي رمز الدخول إلى قلبي ❤️</h2>
        <input type="text" id="pass" maxlength="4" placeholder="????">
        <br>
        <button onclick="checkPass()">دخول</button>
    </div>

    <!-- صفحة الهدية -->
    <div id="gift-page" class="container">
        <h1 style="font-size: 22px; color: #831843;">مفاجأة لرهوفة الجميلة 🎁</h1>
        <div class="gift-box" onclick="openGift()">🎁</div>
        <p style="color: #666; font-size: 16px;">اضغطي على الهدية</p>
        <div id="love-message">
            <p>إلى رهوفة أغلى الناس،<br>
            كل حرف في اسمك هو لحن لقلبي.<br>
            أحبك أكثر مما تتخيلين! ❤️</p>
        </div>
    </div>

    <!-- الحقوق -->
    <footer>
        <p>جميع الحقوق محفوظة ©</p>
        <p>تصميم وتطوير: <a href="https://wa.me/967736398023" target="_blank">فراس</a></p>
    </footer>

    <script>
        function checkPass() {
            let code = document.getElementById('pass').value;
            if (code === '0852') {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('gift-page').style.display = 'block';
            } else {
                alert('الرمز خاطئ، حاولي مرة أخرى يا قلبي!');
            }
        }
        function openGift() {
            document.querySelector('.gift-box').style.display = 'none';
            document.getElementById('love-message').style.display = 'block';
        }
    </script>
</body>
</html>
